---
name: style

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  docs:
    name: "Style enforcement on Python 3.12"
    runs-on: "ubuntu-latest"

    steps:
      - uses: "actions/checkout@v4"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: "Install dependencies"
        run:
          uv sync --frozen
      - name: "Run pre-commit"
        run:
          uv run pre-commit run --all-files
