---
name: typing

on:
  push:
    branches: ["dvm-main", "auto-disputer-main", "main"]
  pull_request:
    branches: ["dvm-main", "auto-disputer-main", "main"]
  workflow_dispatch:

jobs:
  docs:
    name: "Typing enforcement on Python 3.12"
    runs-on: "ubuntu-latest"

    steps:
      - uses: "actions/checkout@v4"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: "Install dependencies"
        run:
          uv sync --frozen
      - name: "Run mypy"
        run:
          uv run mypy --strict src --implicit-reexport --ignore-missing-imports --disable-error-code misc
