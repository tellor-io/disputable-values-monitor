[project]
name = "disputable-values-monitor"
version = "3.0.0"
description = "dashboard & alerts for disputable values reported to Tellor oracles"
authors = [{ name = "Tellor Development Community" }]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1,<9",          # telliot-feeds 0.4.20 pins 8.1.8 exactly
    "discord-webhook>=1.4,<2",
    "pandas>=3.1,<4",
    "numpy>=2.5,<3",
    "tabulate>=0.10,<0.11",
    "python-box>=7.4,<8",
    "telliot-feeds>=0.4.20,<0.5",
    # declared explicitly: imported directly but previously only transitively present
    "web3>=7.14,<8",
    "eth-abi>=5.2,<6",
    "hexbytes>=1.2,<2",
    "chained-accounts>=0.0.1",  # telliot-feeds 0.4.20 pins 0.0.1 exactly
    "clamfig>=0.1.3,<0.2",
    "python-dotenv>=1.0,<2",    # telliot-feeds 0.4.20 pins 1.0.1 exactly
    "aiohttp==3.11.13",         # telliot-feeds pins exactly; version is yanked upstream, so uv needs the exact pin here
    "PyYAML>=6.0,<7",
]

[project.scripts]
cli = "disputable_values_monitor.cli:main"
data = "disputable_values_monitor.data:main"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "black>=26.10,<27",
    "pre-commit>=4.7,<5",
    "mypy>=2.4,<3",
    "types-python-dateutil>=2.9,<3",
    "types-PyYAML>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disputable_values_monitor"]
# preserve the old poetry `include` behavior: these land at wheel root
# (= site-packages), as the README's vars.sh step expects
force-include = { "vars.example.sh" = "vars.example.sh", "disputer-config.yaml" = "disputer-config.yaml", "README.md" = "README.md" }

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "vars.example.sh", "disputer-config.yaml", "README.md"]

[tool.uv]
# telliot-feeds 0.4.20 pins pre-release and yanked versions transitively
# (ipfshttpclient==0.8.0a2, eth-tester==0.13.0b1, aiohttp==3.11.13); without
# this uv refuses them during resolution.
prerelease = "allow"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.isort]
# black-compatible replacement for reorder-python-imports (black>=24 and
# reorder-python-imports have an unresolvable docstring-blank-line conflict).
# force_single_line keeps the repo's merge-conflict-minimizing import style.
profile = "black"
force_single_line = true
known_first_party = ["disputable_values_monitor"]
line_length = 120
