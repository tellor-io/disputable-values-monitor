[project]
name = "disputable-values-monitor"
version = "3.0.0"
description = "dashboard & alerts for disputable values reported to Tellor oracles"
authors = [{ name = "Tellor Development Community" }]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1,<9",          # telliot-feeds 0.4.x pinned 8.1.8 exactly; 0.5.x allows >=8.1,<9
    "discord-webhook>=1.4,<2",
    "pandas>=3.1,<4",
    "numpy>=2.5,<3",
    "tabulate>=0.10,<0.11",
    "python-box>=7.4,<8",
    "telliot-feeds>=0.5.0,<0.6",
    # imported directly; telliot-feeds 0.5.0 pins telliot-core==0.5.0 exactly
    "telliot-core==0.5.0",
    # declared explicitly: imported directly but previously only transitively present
    "web3>=7.14,<8",
    "eth-abi>=5.2,<6",
    "hexbytes>=1.2,<2",
    "chained-accounts>=0.0.1",  # telliot-feeds 0.5.0 pins 0.0.1 exactly
    "clamfig>=0.1.3,<0.2",
    "python-dotenv>=1.0,<2",    # telliot-feeds 0.4.x pinned 1.0.1 exactly; 0.5.x allows >=1.0.1
    "aiohttp==3.11.13",         # telliot-feeds pins exactly; version is yanked upstream, so uv needs the exact pin here
    "PyYAML>=6.0,<7",
]

[project.scripts]
cli = "disputable_values_monitor.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "black>=26.10,<27",
    "pre-commit>=4.7,<5",
    "mypy>=2.4,<3",
    "types-python-dateutil>=2.9,<3",
    "types-PyYAML>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disputable_values_monitor"]
# preserve the old poetry `include` behavior: these land at wheel root
# (= site-packages), as the README's vars.sh step expects
force-include = { "vars.example.sh" = "vars.example.sh", "disputer-config.yaml" = "disputer-config.yaml", "README.md" = "README.md" }

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "vars.example.sh", "disputer-config.yaml", "README.md"]

[tool.uv]
# terra-sdk's betterproto dep (>=2.0.0b4) is a pre-release; without this uv
# refuses it during resolution. (telliot-feeds 0.4.x also pinned pre-releases
# transitively — ipfshttpclient==0.8.0a2, eth-tester==0.13.0b1 — but 0.5.0
# dropped both.)
prerelease = "allow"
# terra-sdk 4.0.0 (and its deps) pin attrs<22-23 and protobuf<4, while
# telliot-feeds requires attrs>=24 and protobuf>=5.29.3 (the
# CVE-2024-7254 security floor). The old manual "pip install terra-sdk" step
# silently DOWNGRADED both, re-introducing that protobuf CVE. Runtime is fine
# on modern versions (verified by import + test suite), so we force single
# modern attrs/protobuf for everyone.
override-dependencies = ["attrs>=24", "protobuf>=5.29.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.isort]
# black-compatible replacement for reorder-python-imports (black>=24 and
# reorder-python-imports have an unresolvable docstring-blank-line conflict).
# force_single_line keeps the repo's merge-conflict-minimizing import style.
profile = "black"
force_single_line = true
known_first_party = ["disputable_values_monitor"]
line_length = 120
