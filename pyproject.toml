[tool.poetry]
name = "disputable-values-monitor"
version = "2.0.5"
description = "dashboard & alerts for disputable values reported to Tellor oracles"
authors = ["Tellor Development Community"]
license = "MIT"
packages = [{ include = "disputable_values_monitor", from = "src" }]
include = ["vars.example.sh", "README.md", "disputer-config.yaml"]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
click = "^8.1"  # telliot-feeds 0.4.20 pins 8.1.8 exactly
discord-webhook = "^1.4"
pandas = "^3.1"
numpy = "^2.5"
tabulate = "^0.10"
python-box = "^7.4"
telliot-feeds = "^0.4.20"
# newly declared: packages imported directly but only transitively present before
web3 = ">=7.14,<8"
eth-abi = "^5.2"
hexbytes = "^1.2"
chained-accounts = ">=0.0.1"  # telliot-feeds 0.4.20 pins 0.0.1 exactly
clamfig = "^0.1.3"
python-dotenv = "^1.0"  # telliot-feeds 0.4.20 pins 1.0.1 exactly
PyYAML = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
pytest-asyncio = "^1.4"
black = "^26.10"
pre-commit = "^4.7"
mypy = "^2.4"
types-python-dateutil = "^2.9"
types-PyYAML = "^6.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
cli = "disputable_values_monitor.cli:main"
data = "disputable_values_monitor.data:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.isort]
# black-compatible replacement for reorder-python-imports (black>=24 and
# reorder-python-imports have an unresolvable docstring-blank-line conflict).
# force_single_line keeps the repo's merge-conflict-minimizing import style.
profile = "black"
force_single_line = true
known_first_party = ["disputable_values_monitor"]
line_length = 120
